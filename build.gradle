plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = mod_version
group = 'dune.createheat'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        server { server() }
        client { client() }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

processResources {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
repositories { mavenCentral() }
dependencies {
    compileOnly fileTree(dir: '.', include: ['*.jar'])
}

def genRes = layout.buildDirectory.dir('genres')
tasks.register('unpackRes', Copy) {
    from zipTree('resources.zip')
    into genRes
}
sourceSets.main.java {
    srcDirs = ['.']
    include '*.java'
}
sourceSets.main.resources.srcDirs = [genRes]
tasks.named('processResources') { dependsOn 'unpackRes' }
